<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16121f">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Consultorio Bendiciones</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-v3-192.png">
<link rel="apple-touch-icon" href="icon-v3-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
:root{--gold:#e6cfa6;--gold2:#c4a273;--ink:#f6f2ec;--ink2:rgba(255,255,255,.86);--muted:rgba(255,255,255,.66);--bad:#f7a8b4;--ok:#9fe3b6;--on-gold:#1a1712;--t1:#6b4fa8;--t2:#2f8f7e;--f:"Outfit","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0e0c14;color:var(--ink);font:400 15px/1.5 var(--f);-webkit-font-smoothing:antialiased}
#lock{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(26px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));text-align:center;position:relative;overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-1;overflow:hidden;background:#16121f}
.bgimg{position:absolute;inset:-18% -25% 30%;background:url(img/rolo.webp) center 30%/cover;filter:blur(48px) saturate(1.5);opacity:.95}
.tint{position:absolute;inset:0;background:linear-gradient(175deg,color-mix(in srgb,var(--t1) 45%,transparent) 0%,color-mix(in srgb,var(--t2) 55%,transparent) 32%,rgba(22,18,31,.9) 62%,#0e0c14 100%)}
.lbl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500}
h1{font-size:30px;font-weight:600;letter-spacing:.02em;margin:2px 0 0;line-height:1.15}
.dogs{flex:1 1 auto;min-height:150px;max-height:min(42dvh,80vw);width:100%;max-width:440px;position:relative;margin:10px 0 6px}
.dogs img{position:absolute;bottom:0;height:100%;width:auto;object-fit:contain;filter:drop-shadow(0 18px 22px rgba(0,0,0,.45))}
.dogs .r{left:50%;transform:translateX(-78%)}
.dogs .m{left:50%;transform:translateX(-18%) scale(.84);transform-origin:bottom center}
.names{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink2);font-weight:400;margin-bottom:18px}
.names i{font-style:normal;color:var(--gold);margin:0 .5em}
.glass{background:rgba(255,255,255,.12);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 30px -14px rgba(0,0,0,.45)}
.panel{width:auto;min-width:230px;max-width:300px;border-radius:28px;padding:16px 26px 16px;display:flex;flex-direction:column;align-items:center}
.sub{color:var(--muted);margin:0 0 14px;font-size:13.5px;line-height:1.4;max-width:240px}
.fp{width:92px;height:92px;border-radius:50%;border:0;padding:0;background:linear-gradient(145deg,var(--gold),var(--gold2));color:var(--on-gold);display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 7px rgba(230,207,166,.16),0 0 0 15px rgba(230,207,166,.07),0 14px 34px -8px rgba(196,162,115,.6);transition:transform .15s;font:inherit}
.fp:active{transform:scale(.94)}
.fp svg{width:48px;height:48px}
.fp-label{margin-top:18px;font-weight:500;font-size:16px;letter-spacing:.01em}
.msg{margin-top:8px;max-width:310px;font-size:13.5px;line-height:1.45;color:var(--muted)}
.msg:empty{display:none}
.msg.err{color:var(--bad)}
.msg.ok{color:var(--ok)}
.small{margin-top:6px;font-size:12px;color:var(--muted)}
.small:empty{display:none}
.small button{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font:inherit;cursor:pointer;padding:6px}
#view{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0e0c14;display:none}
body.open #lock{display:none}
body.open #view{display:block}
.spin{width:20px;height:20px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--gold);border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:middle}
@keyframes s{to{transform:rotate(360deg)}}
@media (max-height:620px){.dogs{max-height:190px}h1{font-size:25px}.fp{width:78px;height:78px}.fp svg{width:40px;height:40px}}
</style>

</head>
<body>
<main id="lock">
  <div class="bg" aria-hidden="true"><div class="bgimg"></div><div class="tint"></div></div>
  <div class="lbl">Consultorio</div>
  <h1 id="title">Bendiciones</h1>
  <div class="dogs" aria-hidden="true"><img class="m" src="img/mateo.webp" alt=""><img class="r" src="img/rolo.webp" alt=""></div>
  <div class="names">Rolo<i>·</i>Mateo</div>
  <section class="panel glass">
    <p class="sub" id="sub">App privada de la familia</p>
    <button class="fp" id="fp" type="button" aria-label="Abrir con huella"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 11v3.5c0 2.2-.6 4.2-1.7 6"/><path d="M8.6 9.4A3.9 3.9 0 0 1 15.9 11v2.4c0 2.6-.5 5-1.5 7.1"/><path d="M5.4 16.6c.4-1 .6-2.1.6-3.2V11a6 6 0 0 1 10-4.5"/><path d="M18 8.6c.6.7 1 1.5 1.1 2.4v2.3c0 1.1-.1 2.2-.3 3.2"/><path d="M3.4 8.5A9 9 0 0 1 18.8 4.9"/><path d="M8.3 20.3c.7-1.5 1.1-3.2 1.1-5V11a2.6 2.6 0 0 1 4.6-1.7"/></svg></button>
    <div class="fp-label" id="fplabel">Abrir con huella</div>
    <div class="msg" id="msg" role="status"></div>
    <div class="small" id="small"></div>
  </section>
</main>
<iframe id="view" title="Consultorio"></iframe>
<script>
"use strict";
const PAGES={inicio:"data/consultorio.enc",vacunas:"data/vacunas.enc",manual:"data/manual.enc",comida:"data/comida.enc"};
const CFG="cx-config-v1";
const LOCK_AFTER_MS=5*60*1000;
const $=id=>document.getElementById(id);
const enc=new TextEncoder(), dec=new TextDecoder();
const b64e=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const b64d=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
let KEY=null, hiddenAt=0;
const cache={};

function say(t,cls){const m=$("msg");m.className="msg"+(cls?" "+cls:"");m.innerHTML=t;}
function busy(on){$("fp").disabled=on;$("fp").style.opacity=on?.6:1;}
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG)||"null");}catch(e){return null;}}
function setCfg(c){localStorage.setItem(CFG,JSON.stringify(c));}

async function importContentKey(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);}
async function wrapKeyFromPrf(prfOut){
  const base=await crypto.subtle.importKey("raw",prfOut,"HKDF",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"HKDF",hash:"SHA-256",salt:new Uint8Array(32),info:enc.encode("consultorio-llave-v1")},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function fetchPage(name){
  const r=await fetch(PAGES[name],{cache:"no-cache"});
  if(!r.ok) throw new Error("No se pudo descargar ("+r.status+")");
  return r.json();
}
async function decryptPage(key,name){
  const p=await fetchPage(name);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(p.iv)},key,b64d(p.ct));
  return dec.decode(pt);
}
function rnd(n){return crypto.getRandomValues(new Uint8Array(n));}
function prfFirst(cred){const x=cred.getClientExtensionResults&&cred.getClientExtensionResults();return x&&x.prf&&x.prf.results&&x.prf.results.first;}
async function assertion(id,salt){
  const opts={publicKey:{challenge:rnd(32),rpId:location.hostname,allowCredentials:[{type:"public-key",id:b64d(id)}],userVerification:"required",timeout:60000}};
  if(salt) opts.publicKey.extensions={prf:{eval:{first:b64d(salt)}}};
  return navigator.credentials.get(opts);
}

/* ---------- Configuración (primera vez en este celular) ---------- */
async function setup(rawKey){
  busy(true);
  try{
    if(!window.PublicKeyCredential) throw new Error("Este navegador no permite usar la huella. Abre el enlace en Google Chrome.");
    say('<span class="spin"></span> Comprobando la llave…');
    const key=await importContentKey(rawKey);
    try{await decryptPage(key,"inicio");}catch(e){throw new Error("Este enlace de configuración no sirve o ya fue cambiado. Pídele a Natalia el enlace nuevo.");}
    say("Pon tu dedo en el lector cuando el celular lo pida.");
    const salt=rnd(32);
    const cred=await navigator.credentials.create({publicKey:{
      rp:{name:"Consultorio Bendiciones",id:location.hostname},
      user:{id:rnd(16),name:"Consultorio Bendiciones",displayName:"Consultorio Bendiciones"},
      challenge:rnd(32),
      pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform",residentKey:"required",userVerification:"required"},
      timeout:90000,
      extensions:{prf:{eval:{first:salt}}}
    }});
    const id=b64e(cred.rawId);
    const ext=cred.getClientExtensionResults?cred.getClientExtensionResults():{};
    let out=prfFirst(cred);
    if(!out && ext.prf && ext.prf.enabled!==false){
      say("Listo. Una vez más: pon el dedo para terminar.");
      try{out=prfFirst(await assertion(id,b64e(salt)));}catch(e){out=null;}
    }
    if(out){
      const wk=await wrapKeyFromPrf(out);
      const iv=rnd(12);
      const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},wk,rawKey);
      setCfg({mode:"huella",id,salt:b64e(salt),iv:b64e(iv),ct:b64e(ct),at:new Date().toISOString()});
    }else{
      setCfg({mode:"basico",id,k:b64e(rawKey),at:new Date().toISOString()});
    }
    history.replaceState(null,"",location.pathname);
    KEY=key;
    say(out?"¡Listo! Desde ahora la app se abre con tu huella.":"Listo, pero este celular no permite el candado completo: quedó en modo básico.",out?"ok":"err");
    setTimeout(()=>openApp(location.hash.slice(1)||"inicio"),900);
  }catch(e){
    console.error(e);
    say(e.name==="NotAllowedError"?"Se canceló o no se reconoció la huella. Toca el botón para intentarlo otra vez.":(e.message||String(e)),"err");
  }finally{busy(false);}
}

/* ---------- Abrir con huella ---------- */
async function unlock(){
  const c=getCfg(); if(!c) return;
  busy(true);
  try{
    say("Pon tu dedo en el lector…");
    if(c.mode==="huella"){
      const out=prfFirst(await assertion(c.id,c.salt));
      if(!out) throw new Error("El celular no devolvió la llave. Vuelve a intentarlo.");
      const wk=await wrapKeyFromPrf(out);
      const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(c.iv)},wk,b64d(c.ct));
      KEY=await importContentKey(raw);
    }else{
      await assertion(c.id,null);
      KEY=await importContentKey(b64d(c.k));
    }
    say('<span class="spin"></span> Abriendo…');
    await openApp(location.hash.slice(1)||"inicio");
  }catch(e){
    console.error(e);
    if(e.name==="OperationError") say("La llave de la app cambió. Pídele a Natalia el enlace nuevo y toca «Configurar de nuevo».","err");
    else say(e.name==="NotAllowedError"?"No se reconoció la huella. Toca el botón para intentarlo otra vez.":(e.message||String(e)),"err");
  }finally{busy(false);}
}

/* ---------- Mostrar páginas ---------- */
async function show(name){
  if(!PAGES[name]) name="inicio";
  if(!cache[name]) cache[name]=await decryptPage(KEY,name);
  const v=$("view");
  v.srcdoc=cache[name];
  document.title=name==="inicio"?"Consultorio Bendiciones":({vacunas:"Plan de vacunas",manual:"Manual de Rolo",comida:"Comparativa de comida"})[name];
}
async function openApp(name){
  await show(name);
  document.body.classList.add("open");
}
addEventListener("hashchange",()=>{
  const h=location.hash.slice(1);
  if(h.startsWith("llave=")){location.reload();return;}
  if(KEY) show(h).catch(e=>console.error(e));
});
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();}
  else if(KEY && hiddenAt && Date.now()-hiddenAt>LOCK_AFTER_MS){location.replace(location.pathname);}
});

function resetDevice(){
  if(!confirm("¿Borrar la configuración de este celular? Después necesitarás el enlace de configuración para volver a entrar.")) return;
  localStorage.removeItem(CFG);location.replace(location.pathname);
}

/* ---------- Arranque ---------- */
(function start(){
  const m=location.hash.match(/^#llave=([A-Za-z0-9_-]{43})/);
  const c=getCfg();
  if(m){
    $("title").textContent="Bendiciones";
    $("sub").textContent="Configura este celular. Solo se hace una vez, en Google Chrome.";
    $("fplabel").textContent="Toca el círculo para empezar";
    say("Al tocarlo, el celular te pedirá la huella.");
    const raw=b64d(m[1]);
    $("fp").onclick=()=>setup(raw);
    if(c) say("Este celular ya estaba configurado. Si continúas, se reemplaza la configuración anterior.");
  }else if(c){
    $("fp").onclick=unlock;
    $("fplabel").textContent="Toca el círculo para abrir";
    $("small").innerHTML=(c.mode==="basico"?"Modo básico · ":"")+'<button type="button" id="reset">Configurar de nuevo</button>';
    $("reset").onclick=resetDevice;
  }else{
    
    $("sub").textContent="Este celular todavía no está configurado. Abre el enlace de configuración que te envió Natalia.";
    $("fp").style.display="none";$("fplabel").style.display="none";
  }
})();

if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
</body>
</html>
